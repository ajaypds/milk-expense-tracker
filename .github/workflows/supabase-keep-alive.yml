name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP request to Supabase
        run: |
          echo "Pinging Supabase REST endpoint to keep free-tier project active..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/user_settings?select=count")
          
          echo "HTTP Response Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Supabase project pinged successfully! Database activity registered."
          else
            echo "⚠️ Unexpected status code: $HTTP_STATUS"
            # Still exit 0 if unauthenticated ping registered network traffic at edge
          fi
